[package]
name = "chat-friends-backend"
version = "2.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "compression-gzip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
argon2 = "0.6.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
time = "0.3.55"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
